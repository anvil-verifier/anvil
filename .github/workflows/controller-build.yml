name: Controller build
on:
  workflow_dispatch:
env:
  IMAGE_NAME: ${{ github.repository }}
jobs:
  setup-toolchain:
    runs-on: ubuntu-24.04
    outputs:
      verus-sha: ${{ steps.verus-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Verus (latest main)
        uses: actions/checkout@v7
        with:
          repository: verus-lang/verus
          path: verus-src
      - name: Get Verus commit SHA
        id: verus-sha
        run: |
          SHA="$(git -C verus-src rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building Verus main@$SHA"
      - name: Cache toolchains
        id: cache-toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/verus
          key: toolchain-${{ runner.os }}-${{ steps.verus-sha.outputs.sha }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install Rust if cache is missing
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL "https://sh.rustup.rs" \
            | sh -s -- --default-toolchain none -y
          . "$HOME/.cargo/env"
          rustup toolchain install
      - name: Build Verus if cache is missing
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          . "$HOME/.cargo/env"
          cd verus-src/source
          ./tools/get-z3.sh
          source ../tools/activate
          vargo build --release
          mv target-verus/release "$HOME/verus"
      - name: Seed cargo registry
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          . "$HOME/.cargo/env"
          cargo fetch

  build-vreplicaset-controller:
    needs: setup-toolchain
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/verus
          key: toolchain-${{ runner.os }}-${{ needs.setup-toolchain.outputs.verus-sha }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Log into registry ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build vreplicaset controller image
        run: |
          . "$HOME/.cargo/env"
          export PATH="$PATH:$HOME/verus"
          cargo verus build --release --bin vreplicaset_controller -- --no-verify --time
          docker build -f docker/controller/Dockerfile -t ghcr.io/${{ env.IMAGE_NAME }}/vreplicaset-controller:latest --build-arg APP=vreplicaset .
          docker tag ghcr.io/${{ env.IMAGE_NAME }}/vreplicaset-controller:latest ghcr.io/${{ env.IMAGE_NAME }}/vreplicaset-controller:${{ github.sha }}
      - name: Push vreplicaset controller image
        run: |
          docker push ghcr.io/${{ env.IMAGE_NAME }}/vreplicaset-controller:latest
          docker push ghcr.io/${{ env.IMAGE_NAME }}/vreplicaset-controller:${{ github.sha }}

